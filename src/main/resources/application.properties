# APPLICATION
spring.application.name=GOATSPORTS-PAYMENT-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SECURITY
app.gateway.secret=${JWT_SECRET}
# VNPAY
payment.provider.vnpay.enabled=${VNPAY_ENABLED}
payment.provider.vnpay.payment-url=${VNPAY_PAYMENT_URL}
payment.provider.vnpay.return-url=${VNPAY_RETURN_URL}
payment.provider.vnpay.tmn-code=${VNPAY_TMN_CODE}
payment.provider.vnpay.hash-secret=${VNPAY_HASH_SECRET}
payment.provider.vnpay.version=${VNPAY_VERSION}
payment.provider.vnpay.command=pay
payment.provider.vnpay.order-type=${VNPAY_ORDER_TYPE}
payment.provider.vnpay.expiration-minutes=${VNPAY_EXPIRATION_MINUTES}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh