# APPLICATION
spring.application.name=GOATSPORTS-PAYMENT-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SECURITY
app.gateway.secret=${JWT_SECRET}
# VIETQR
payment.provider.vietqr.enabled=${VIETQR_ENABLED:false}
payment.provider.vietqr.api-url=${VIETQR_API_URL:https://api.vietqr.io/v2/generate}
payment.provider.vietqr.quick-link-base-url=${VIETQR_QUICK_LINK_BASE_URL:https://img.vietqr.io/image}
payment.provider.vietqr.client-id=${VIETQR_CLIENT_ID:}
payment.provider.vietqr.api-key=${VIETQR_API_KEY:}
payment.provider.vietqr.account-no=${VIETQR_ACCOUNT_NO:}
payment.provider.vietqr.account-name=${VIETQR_ACCOUNT_NAME:}
payment.provider.vietqr.acq-id=${VIETQR_ACQ_ID:}
payment.provider.vietqr.template=${VIETQR_TEMPLATE:compact2}
payment.provider.vietqr.timeout-seconds=${VIETQR_TIMEOUT_SECONDS:30}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
payment.events.publisher-enabled=${PAYMENT_EVENTS_PUBLISHER_ENABLED}
payment.events.topic=${PAYMENT_EVENTS_TOPIC}
payment.events.send-timeout-seconds=${PAYMENT_EVENTS_SEND_TIMEOUT_SECONDS}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh
