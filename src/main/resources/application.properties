# APPLICATION
spring.application.name=GOATSPORTS-PAYMENT-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SECURITY
app.gateway.secret=${JWT_SECRET}
# MOMO
payment.provider.momo.enabled=${MOMO_ENABLED}
payment.provider.momo.api-url=${MOMO_API_URL}
payment.provider.momo.query-url=${MOMO_QUERY_URL}
payment.provider.momo.refund-url=${MOMO_REFUND_URL}
payment.provider.momo.refund-query-url=${MOMO_REFUND_QUERY_URL}
payment.provider.momo.redirect-url=${MOMO_REDIRECT_URL}
payment.provider.momo.ipn-url=${MOMO_IPN_URL}
payment.provider.momo.partner-code=${MOMO_PARTNER_CODE}
payment.provider.momo.access-key=${MOMO_ACCESS_KEY}
payment.provider.momo.secret-key=${MOMO_SECRET_KEY}
payment.provider.momo.store-name=${MOMO_STORE_NAME}
payment.provider.momo.store-id=${MOMO_STORE_ID}
payment.provider.momo.request-type=captureWallet
payment.provider.momo.timeout-seconds=${MOMO_TIMEOUT_SECONDS}
payment.provider.momo.reconciliation-enabled=${MOMO_RECONCILIATION_ENABLED}
payment.provider.momo.reconciliation-interval-ms=${MOMO_RECONCILIATION_INTERVAL_MS}
payment.provider.momo.reconciliation-min-age-seconds=${MOMO_RECONCILIATION_MIN_AGE_SECONDS}
payment.provider.momo.reconciliation-batch-size=${MOMO_RECONCILIATION_BATCH_SIZE}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh