# APPLICATION
spring.application.name=GOATSPORTS-PAYMENT-SERVICE
spring.threads.virtual.enabled=true
server.port=${SERVER_PORT}
# SQL
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false
# EUREKA
eureka.client.enabled=${EUREKA_CLIENT_ENABLED}
spring.cloud.discovery.enabled=${EUREKA_DISCOVERY_ENABLED}
eureka.client.service-url.defaultZone=${EUREKA_SERVICE_URL}
eureka.instance.prefer-ip-address=${EUREKA_SERVICE_PREFER_IP_ADDRESS}
# SECURITY
app.gateway.secret=${JWT_SECRET}
# PAYOS
payment.provider.payos.api-url=${PAYOS_API_URL}
payment.provider.payos.enabled=${PAYOS_ENABLED}
payment.provider.payos.client-id=${PAYOS_CLIENT_ID}
payment.provider.payos.api-key=${PAYOS_API_KEY}
payment.provider.payos.checksum-key=${PAYOS_CHECKSUM_KEY}
payment.provider.payos.payout-enabled=${PAYOS_PAYOUT_ENABLED}
payment.provider.payos.payout-client-id=${PAYOS_PAYOUT_CLIENT_ID}
payment.provider.payos.payout-api-key=${PAYOS_PAYOUT_API_KEY}
payment.provider.payos.payout-checksum-key=${PAYOS_PAYOUT_CHECKSUM_KEY}
payment.provider.payos.webhook-url=${PAYOS_WEBHOOK_URL}
payment.provider.payos.return-url=${PAYOS_RETURN_URL}
payment.provider.payos.cancel-url=${PAYOS_CANCEL_URL}
payment.provider.payos.timeout-ms=${PAYOS_TIMEOUT_MS}
payment.provider.payos.max-retries=${PAYOS_MAX_RETRIES}
payment.provider.payos.register-webhook-on-startup=${PAYOS_REGISTER_WEBHOOK_ON_STARTUP}
# PAYMENT RECONCILIATION
payment.reconciliation.enabled=${PAYMENT_RECONCILIATION_ENABLED}
payment.reconciliation.delay-ms=${PAYMENT_RECONCILIATION_DELAY_MS}
payment.reconciliation.stale-after-seconds=${PAYMENT_RECONCILIATION_STALE_AFTER_SECONDS}
payment.reconciliation.batch-size=${PAYMENT_RECONCILIATION_BATCH_SIZE}
# BANK ACCOUNT
bank.directory.url=${BANK_DIRECTORY_URL}
bank.account.encryption-key=${BANK_ACCOUNT_ENCRYPTION_KEY}
# KAFKA
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5
spring.kafka.topic.user-log=${KAFKA_TOPIC_USER_LOG}
payment.events.publisher-enabled=${PAYMENT_EVENTS_PUBLISHER_ENABLED}
payment.events.topic=${PAYMENT_EVENTS_TOPIC}
payment.events.send-timeout-seconds=${PAYMENT_EVENTS_SEND_TIMEOUT_SECONDS}
# ACTUATOR
management.endpoints.web.exposure.include=health,info,prometheus
management.info.env.enabled=true
management.endpoint.health.probes.enabled=true
management.endpoint.health.status.http-mapping.UP=200
management.endpoint.health.status.http-mapping.DOWN=503
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# LOGGING
logging.level.root=INFO
logging.level.me.minhdat=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{correlationId:-}] - %msg%n
# JSON
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=Asia/Ho_Chi_Minh