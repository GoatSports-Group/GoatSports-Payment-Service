server.port=0

spring.datasource.url=jdbc:h2:mem:payment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.gateway.secret=test-gateway-secret

payment.provider.vnpay.enabled=true
payment.provider.vnpay.payment-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
payment.provider.vnpay.return-url=https://client.goatsports.test/payment/vnpay-return
payment.provider.vnpay.tmn-code=TESTCODE
payment.provider.vnpay.hash-secret=test-vnpay-hash-secret
payment.provider.vnpay.version=2.1.0
payment.provider.vnpay.command=pay
payment.provider.vnpay.order-type=other
payment.provider.vnpay.expiration-minutes=15

spring.kafka.topic.user-log=user-log-topic-test

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.iuh.fit.paymentservice=INFO
