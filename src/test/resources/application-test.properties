server.port=0

spring.datasource.url=jdbc:h2:mem:payment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.gateway.secret=test-gateway-secret

payment.provider.payos.enabled=false
payment.provider.payos.payout-enabled=false
payment.provider.payos.payout-client-id=
payment.provider.payos.payout-api-key=
payment.provider.payos.payout-checksum-key=
payment.provider.payos.register-webhook-on-startup=false
payment.provider.payos.timeout-ms=30000
payment.provider.payos.max-retries=0
payment.reconciliation.enabled=false
bank.account.encryption-key=test-bank-account-encryption-key-32-characters
bank.directory.url=https://api.vietqr.io/v2/banks

spring.kafka.topic.user-log=user-log-topic-test
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

payment.events.publisher-enabled=false
payment.events.topic=payment-events-topic-test
payment.events.send-timeout-seconds=10

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.iuh.fit.paymentservice=INFO
app.demo-data.enabled=false
user-deleted.consumer-enabled=false
