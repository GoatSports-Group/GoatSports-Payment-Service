server.port=0

spring.datasource.url=jdbc:h2:mem:payment_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

eureka.client.enabled=false
spring.cloud.discovery.enabled=false

app.gateway.secret=test-gateway-secret

payment.provider.momo.enabled=true
payment.provider.momo.api-url=https://test-payment.momo.vn/v2/gateway/api/create
payment.provider.momo.query-url=https://test-payment.momo.vn/v2/gateway/api/query
payment.provider.momo.refund-url=https://test-payment.momo.vn/v2/gateway/api/refund
payment.provider.momo.refund-query-url=https://test-payment.momo.vn/v2/gateway/api/refund/query
payment.provider.momo.redirect-url=https://client.goatsports.test/payment/momo-return
payment.provider.momo.ipn-url=https://api.goatsports.test/payment-service/api/v1/payments/providers/momo/webhook
payment.provider.momo.partner-code=MOMO_TEST
payment.provider.momo.access-key=test-momo-access-key
payment.provider.momo.secret-key=test-momo-secret-key
payment.provider.momo.store-name=GoatSports Test
payment.provider.momo.store-id=GoatSportsTest
payment.provider.momo.request-type=captureWallet
payment.provider.momo.timeout-seconds=30
payment.provider.momo.reconciliation-enabled=false
payment.provider.momo.reconciliation-interval-ms=60000
payment.provider.momo.reconciliation-min-age-seconds=60
payment.provider.momo.reconciliation-batch-size=50

spring.kafka.topic.user-log=user-log-topic-test
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.in.flight.requests.per.connection=5

payment.events.publisher-enabled=false
payment.events.topic=payment-events-topic-test
payment.events.send-timeout-seconds=10

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

logging.level.root=WARN
logging.level.iuh.fit.paymentservice=INFO
